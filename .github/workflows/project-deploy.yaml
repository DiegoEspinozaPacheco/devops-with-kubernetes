name: Release the project

on:
  push:
    paths:
      - '3.6/**'
      - '.github/workflows/project-deploy.yaml'

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}
  GKE_CLUSTER: dwk-cluster
  GKE_ZONE: europe-north1-b
  REGISTRY: europe-north1-docker.pkg.dev
  REPOSITORY: dwk-project
  BRANCH: ${{ github.ref_name }}

jobs:
  build-publish-deploy:
    name: Build, Publish and Deploy
    runs-on: ubuntu-latest
    environment: GKE_PROJECT
    defaults:
      run:
        working-directory: 3.6

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.SERVICE_ACCOUNT }}"

      - name: 'Set up Cloud SDK'
        uses: google-github-actions/setup-gcloud@v3

      - run: gcloud --quiet auth configure-docker $REGISTRY

      - name: 'Get GKE credentials'
        uses: 'google-github-actions/get-gke-credentials@v3'
        with:
          cluster_name: '${{ env.GKE_CLUSTER }}'
          project_id: '${{ env.PROJECT_ID }}'
          location: '${{ env.GKE_ZONE }}'

      - name: Form image tags
        run: |
          echo "TODO_APP_IMAGE=$REGISTRY/$PROJECT_ID/$REPOSITORY/todo-app:$BRANCH-$GITHUB_SHA" >> $GITHUB_ENV
          echo "TODO_BACKEND_IMAGE=$REGISTRY/$PROJECT_ID/$REPOSITORY/todo-backend:$BRANCH-$GITHUB_SHA" >> $GITHUB_ENV
          echo "WIKIPEDIA_REMINDER_IMAGE=$REGISTRY/$PROJECT_ID/$REPOSITORY/wikipedia-reminder:$BRANCH-$GITHUB_SHA" >> $GITHUB_ENV

      - name: Build
        run: |
          docker build --tag $TODO_APP_IMAGE ./todo-app
          docker build --tag $TODO_BACKEND_IMAGE ./todo-backend
          docker build --tag $WIKIPEDIA_REMINDER_IMAGE ./wikipedia-reminder

      - name: Publish
        run: |
          docker push $TODO_APP_IMAGE
          docker push $TODO_BACKEND_IMAGE
          docker push $WIKIPEDIA_REMINDER_IMAGE

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Deploy
        run: |-
          kustomize edit set image todo-app=$TODO_APP_IMAGE
          kustomize edit set image todo-backend=$TODO_BACKEND_IMAGE
          kustomize edit set image wikipedia-reminder=$WIKIPEDIA_REMINDER_IMAGE
          kustomize build . | kubectl apply -f -
          kubectl rollout status deployment/todo-app -n project
          kubectl rollout status deployment/todo-backend -n project
          kubectl get services -n project -o wide