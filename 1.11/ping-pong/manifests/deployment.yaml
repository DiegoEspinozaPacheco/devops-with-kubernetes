apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping-pong
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ping-pong
  template:
    metadata:
      labels:
        app: ping-pong
    spec:
      volumes:
        - name: shared-storage
          persistentVolumeClaim:
            claimName: shared-claim
      containers:
        - name: ping-pong
          image: ping-pong:latest
          imagePullPolicy: Never
          env:
            - name: PORT
              value: "3002"
          volumeMounts:
            - name: shared-storage
              mountPath: /usr/src/app/files