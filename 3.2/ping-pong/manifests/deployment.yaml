apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping-pong
  namespace: gcp-gke
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ping-pong
  template:
    metadata:
      labels:
        app: ping-pong
    spec:
      containers:
        - name: ping-pong
          image: diegoespinozapacheco/ping-pong-gke:latest
          env:
            - name: PORT
              value: "3002"